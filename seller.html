<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Store</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:14px;
background:#2d6cdf;
color:white;
border:none;
border-radius:8px;
font-size:18px;
}
</style>

</head>

<body>

<div class="box">

<h2>Create Your Store</h2>

<input id="storeName" placeholder="Store Name">

<input id="ownerName" placeholder="Owner Name">

<input id="phone" placeholder="Phone Number">
<input id="country" placeholder="Country">

<input id="province" placeholder="Province">

<input id="district" placeholder="District">

<input id="tehsil" placeholder="Tehsil">
<textarea id="address" placeholder="Address"></textarea>

<button onclick="createStore()">
Create Store
</button>

</div>

<script>

function createStore(){

localStorage.setItem("storeName",
document.getElementById("storeName").value);

localStorage.setItem("ownerName",
document.getElementById("ownerName").value);
const store = document.getElementById("storeName").value.trim();
const owner = document.getElementById("ownerName").value.trim();
const phone = document.getElementById("phone").value.trim();
    
coconst country = document.getElementById("country").value.trim();
const province = document.getElementById("province").value.trim();
const district = document.getElementById("district").value.trim();
const tehsil = document.getElementById("tehsil").value.trim();nst address = document.getElementById("address").value.trim();

if(
store=="" ||
owner=="" ||
phone=="" ||
country=="" ||
province=="" ||
district=="" ||
tehsil=="" ||
address==""
){
    alert("براہ کرم تمام معلومات مکمل کریں۔");
    return;
}
localStorage.setItem("storeCreated","yes");
    
location.href="dashboard.html";

}

</script>

</body>
</html>
