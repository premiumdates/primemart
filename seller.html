<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeMart Seller Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<h1>PrimeMart Seller Dashboard</h1>
</header>

<section class="seller-dashboard">

<h2>Add New Product</h2>

<input type="text" placeholder="Product Name">

<input type="number" placeholder="Price">

<input type="number" placeholder="Stock Quantity">

<input type="file">

<textarea placeholder="Product Description"></textarea>

<button>Add Product</button>

</section>
<section class="seller-products">

<h2>My Products</h2>

<table>

<tr>
<th>Product</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>
</tr>

<tr>
<td>Premium Dates</td>
<td>Rs. 2,999</td>
<td>50</td>
<td>
<button>Edit</button>
<button>Delete</button>
</td>
</tr>

<tr>
<td>Pure Honey</td>
<td>Rs. 1,499</td>
<td>30</td>
<td>
<button>Edit</button>
<button>Delete</button>
</td>
</tr>

</table>

</section>

<footer class="footer">
<p>© 2026 PrimeMart Seller Panel</p>
</footer>

</body>
</html>
