<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Account - PrimeMart</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="choose-account">

<div class="choose-box">

<img src="logo.png" alt="PrimeMart">

<h1>Welcome to PrimeMart</h1>

<p class="subtitle">

Choose how you want to continue with PrimeMart.

</p>

<div class="account-info">

<div class="card buyer-card">

<h2>🛒 Buyer</h2>

<p>

Shop from thousands of trusted sellers.

</p>

<button id="buyerBtn" class="buyer-btn">

Continue as Buyer

</button>

</div>

<div class="card seller-card">

<h2>🏪 Become a Seller</h2>

<p>

Create your own store and start selling worldwide.

</p>

<button id="sellerBtn" class="seller-btn">

Become a Seller

</button>

</div>

</div>

</div>

</div>

<script src="choose-account.js"></script>

</body>

</html>
