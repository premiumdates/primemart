<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Store - PrimeMart</title>

    <link rel="stylesheet" href="create-store.css">
</head>

<body>
<header class="header">

<div class="logo">
  <img src="logo.png" alt="PrimeMart Logo">
<h1>PrimeMart</h1>
</div>

<input type="text" id="searchBox" class="search" placeholder="Search Products, Stores, Categories...">

<nav>

<a href="index.html">Home</a>

<a href="#">Categories</a>

<a href="products.html">Products</a>

<a href="seller.html">Become Seller</a>

<a href="#">Support</a>

<a href="login.html" class="login-btn">Login</a>

<a href="signup.html" class="signup-btn">Sign Up</a>

<a href="#">Cart 🛒</a>

</nav>

</header>
<div class="store-container">

    <h1>🏪 Create Your Store</h1>
    <p>Start your business on PrimeMart and reach thousands of customers.</p>

    <form id="createStoreForm">

        <label>Store Name</label>
        <input
        type="text"
        id="storeName"
        placeholder="Enter Store Name"
        required>
    <p id="storeNameStatus"></p>

<hr>
        <label>Store Description</label>

        <textarea
         <label>Payment Method</label>

<select id="paymentMethod" required>
<option value="">Select Payment Method</option>
<option>JazzCash</option>
<option>EasyPaisa</option>
<option>Bank Account</option>
        </select> 
            <label>Payment Number / Bank Account</label>

<input
type="text"
id="paymentNumber"
placeholder="Enter JazzCash / EasyPaisa / Bank Account Number"
required>
        id="storeDescription"
        rows="4"
        placeholder="Write a short description about your store"></textarea>

        <label>Store Category</label>

        <select id="storeCategory" required>

            <option value="">Select Category</option>

            <option>All Categories</option>

            <option>Mobile Phones</option>

            <option>Electronics</option>

            <option>Fashion</option>

            <option>Men Clothing</option>

            <option>Women Clothing</option>

            <option>Shoes</option>

            <option>Watches</option>

            <option>Beauty</option>

            <option>Health</option>

            <option>Sports</option>

            <option>Books</option>

            <option>Home & Kitchen</option>

            <option>Furniture</option>

            <option>Computers</option>

            <option>Gaming</option>

            <option>Automotive</option>

            <option>Baby Products</option>

            <option>Groceries</option>

            <option>Pets</option>

        </select>

        <label class="checkbox">

            <input type="checkbox" required>

            I agree to the Terms & Conditions

        </label>

        <button type="submit">

            Create Store

        </button>

    </form>

</div>

<script src="create-store.js"></script>

</body>
</html>
