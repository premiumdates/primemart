<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeMart Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<div class="brand">
    <img src="logo.png" alt="PrimeMart Logo" class="logo">
    <h1>PrimeMart</h1>
</div>

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">
 <input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="country" placeholder="Country">

<input type="text" id="province" placeholder="Province">

<input type="text" id="division" placeholder="Division">

<input type="text" id="district" placeholder="District">

<input type="text" id="tehsil" placeholder="Tehsil">

<input type="text" id="city" placeholder="City / Village">

<input type="text" id="postalCode" placeholder="Postal Code">

<textarea id="address" placeholder="Complete Address"></textarea>   
<input type="password" id="password" placeholder="Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<button id="signupBtn">Create Account</button>
<hr>
    
<button id="googleSignupBtn">
    Continue with Google
</button>
<p>Already have an account?
<a href="login.html">Login</a>
</p>

</div>
<script type="module" src="signup.js"></script>
</body>
</html>
